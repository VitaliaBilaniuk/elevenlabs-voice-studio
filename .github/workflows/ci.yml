name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # clips.test.mjs / graphql.test.mjs boot a real, ephemeral MongoDB
      # (mongodb-memory-server) pinned to 7.0.14 in server/test-mongo.mjs;
      # cache its downloaded binary so CI doesn't re-fetch it every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
